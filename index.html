<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Tentez votre chance !</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(720deg) scale(0); opacity: 0; }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        @keyframes neonPulse {
            0%, 100% { filter: drop-shadow(0 0 5px currentColor); }
            50% { filter: drop-shadow(0 0 15px currentColor); }
        }

        @keyframes celebration {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(5deg); }
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            animation: float 20s linear infinite;
            pointer-events: none;
        }

        .sparkles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 1000;
            animation: confetti 4s ease-out forwards;
        }

        .container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px) saturate(180%);
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.3),
                0 0 0 1px rgba(255,255,255,0.2) inset,
                0 0 80px rgba(255,255,255,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255,255,255,0.15);
            margin: 10px;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 26px;
            padding: 1px;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: shimmer 3s linear infinite;
        }

        .header {
            margin-bottom: 15px;
        }

        h1 {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            filter: drop-shadow(0 3px 10px rgba(0,0,0,0.3));
            animation: float 4s ease-in-out infinite;
            letter-spacing: 1px;
            line-height: 1.3;
            white-space: normal;
            text-align: center;
            padding: 0 10px;
        }

        .subtitle {
            color: rgba(255,255,255,0.95);
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            margin-bottom: 10px;
        }

        .prize-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            margin: 15px 0;
            box-shadow: 
                0 8px 25px rgba(255,215,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 25px auto;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.4));
        }

        .wheel-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
            z-index: -1;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 12px solid rgba(255,255,255,0.2);
            position: relative;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(
                from 0deg,
                #00d2ff 0deg 90deg,
                #ff006e 90deg 180deg,
                #00d2ff 180deg 270deg,
                #ff006e 270deg 360deg
            );
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.4),
                inset 0 0 40px rgba(255,255,255,0.1),
                0 0 0 6px rgba(255,255,255,0.1);
        }

        .wheel::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #ffd700, #ff6b6b, #4ecdc4, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: shimmer 2s linear infinite;
            background-size: 300% 300%;
        }

        .wheel::after {
            content: '';
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 60%, rgba(255,255,255,0.1) 100%);
        }

        .wheel-text {
            position: absolute;
            width: 100%;
            height: 100%;
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
            text-shadow: 
                2px 2px 4px rgba(0,0,0,0.6),
                0 0 15px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
        }

        .wheel-text span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }

        .wheel-text span:nth-child(1) {
            transform: translate(-50%, -50%) rotate(-45deg) translateY(-90px) rotate(45deg);
        }

        .wheel-text span:nth-child(2) {
            transform: translate(-50%, -50%) rotate(45deg) translateY(-90px) rotate(-45deg);
        }

        .wheel-text span:nth-child(3) {
            transform: translate(-50%, -50%) rotate(135deg) translateY(-90px) rotate(-135deg);
        }

        .wheel-text span:nth-child(4) {
            transform: translate(-50%, -50%) rotate(225deg) translateY(-90px) rotate(-225deg);
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            z-index: 10;
            box-shadow: 
                0 6px 20px rgba(0,0,0,0.5),
                inset 0 1px 6px rgba(255,255,255,0.2);
        }

        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff006e;
            z-index: 15;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
            animation: neonPulse 2s ease-in-out infinite;
        }

        .spin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 12px 30px rgba(102, 126, 234, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.3);
            margin-top: 20px;
            width: 100%;
            max-width: 280px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .spin-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s linear infinite;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 
                0 15px 40px rgba(102, 126, 234, 0.6),
                inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .spin-button:active:not(:disabled) {
            transform: translateY(-1px) scale(1.01);
        }

        .spin-button:disabled {
            background: linear-gradient(135deg, #888 0%, #666 100%);
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result.show {
            opacity: 1;
            transform: scale(1);
        }

        .result.win {
            background: linear-gradient(135deg, #00f260 0%, #0575e6 100%);
            color: white;
            box-shadow: 
                0 12px 30px rgba(0,242,96,0.4),
                inset 0 1px 0 rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .result.lose {
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 100%);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .stock-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(255,215,0,0.3) 0%, rgba(255,193,7,0.2) 100%);
            border: 1px solid rgba(255,215,0,0.5);
            border-radius: 40px;
            font-size: 1.3rem;
            color: #ffd700;
            font-weight: 800;
            box-shadow: 
                0 4px 15px rgba(255,193,7,0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            min-width: 50px;
            text-align: center;
        }

        .stock-counter strong {
            color: #ffd700;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(255,215,0,0.5);
        }

        .stock-empty {
            background: linear-gradient(135deg, rgba(255,0,110,0.3) 0%, rgba(255,0,80,0.2) 100%);
            border-color: rgba(255,0,110,0.5);
            color: #ff006e;
        }

        .stock-empty strong {
            color: #ff006e;
        }

        .last-winner {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(0,210,255,0.3) 0%, rgba(35,166,213,0.2) 100%);
            border: 1px solid rgba(0,210,255,0.5);
            border-radius: 20px;
            font-size: 1rem;
            color: white;
            display: none;
            font-weight: 600;
            box-shadow: 
                0 8px 25px rgba(0,210,255,0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }

        .celebrate {
            animation: celebration 0.5s ease-in-out 3;
        }

        .loading {
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Responsive pour très petits écrans */
        @media (max-width: 380px) {
            .container {
                padding: 20px 15px;
                border-radius: 20px;
                margin: 5px;
            }
            
            h1 {
                font-size: 1.5rem;
                padding: 0 5px;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .wheel-container {
                width: 240px;
                height: 240px;
                margin: 20px auto;
            }
            
            .wheel-text {
                font-size: 1.1rem;
            }
            
            .wheel-text span:nth-child(1) {
                transform: translate(-50%, -50%) rotate(-45deg) translateY(-75px) rotate(45deg);
            }
            
            .wheel-text span:nth-child(2) {
                transform: translate(-50%, -50%) rotate(45deg) translateY(-75px) rotate(-45deg);
            }
            
            .wheel-text span:nth-child(3) {
                transform: translate(-50%, -50%) rotate(135deg) translateY(-75px) rotate(-135deg);
            }
            
            .wheel-text span:nth-child(4) {
                transform: translate(-50%, -50%) rotate(225deg) translateY(-75px) rotate(-225deg);
            }
            
            .prize-badge {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
            
            .spin-button {
                padding: 14px 30px;
                font-size: 1.1rem;
                max-width: 240px;
            }
            
            .stock-counter {
                top: 10px;
                right: 10px;
                padding: 8px 12px;
                font-size: 1.1rem;
            }
        }

        /* Responsive pour tablettes et grands écrans */
        @media (min-width: 768px) {
            .container {
                padding: 30px 25px;
                max-width: 450px;
            }
            
            .wheel-container {
                width: 320px;
                height: 320px;
            }
            
            .wheel-text span:nth-child(1) {
                transform: translate(-50%, -50%) rotate(-45deg) translateY(-105px) rotate(45deg);
            }
            
            .wheel-text span:nth-child(2) {
                transform: translate(-50%, -50%) rotate(45deg) translateY(-105px) rotate(-45deg);
            }
            
            .wheel-text span:nth-child(3) {
                transform: translate(-50%, -50%) rotate(135deg) translateY(-105px) rotate(-135deg);
            }
            
            .wheel-text span:nth-child(4) {
                transform: translate(-50%, -50%) rotate(225deg) translateY(-105px) rotate(-225deg);
            }
        }
    </style>
</head>
<body>
    <div class="sparkles" id="sparkles"></div>

    <div class="stock-counter" id="stockCounter">
        <div class="loading">⏳ Chargement...</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🎰 ROUE DE LA CHANCE 🎰</h1>
            <p class="subtitle">Tournez et gagnez !</p>
            <div class="prize-badge">
                🔥 10 GRILLE-PAINS À GAGNER 🔥
            </div>
        </div>

        <div class="wheel-container">
            <div class="wheel-glow"></div>
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-text">
                    <span>GAGNÉ</span>
                    <span>PERDU</span>
                    <span>GAGNÉ</span>
                    <span>PERDU</span>
                </div>
                <div class="wheel-center"></div>
            </div>
        </div>

        <button class="spin-button" id="spinButton">
            ✨ TOURNER ✨
        </button>

        <div class="result" id="result"></div>

        <div class="last-winner" id="lastWinner">
            🏆 Dernier gagnant à --:--
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, get, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBqydbRduqfwgOdxDT9_trv_c16w4GpNeA",
            authDomain: "roue-chance.firebaseapp.com",
            databaseURL: "https://roue-chance-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "roue-chance",
            storageBucket: "roue-chance.firebasestorage.app",
            messagingSenderId: "853891277239",
            appId: "1:853891277239:web:c244df63fab8a9dc138832"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const gameStateRef = ref(database, 'wheelGameState');

        const state = {
            winnersCount: 0,
            isSpinning: false,
            totalPrizes: 10,
            lastWinner: null
        };

        // Créer des étoiles scintillantes
        function createSparkles() {
            const sparklesContainer = document.getElementById('sparkles');
            for (let i = 0; i < 25; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 1) + 's';
                sparklesContainer.appendChild(sparkle);
            }
        }

        async function initializeState() {
            createSparkles();
            
            try {
                const snapshot = await get(gameStateRef);
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const now = new Date();
                    const storedDate = new Date(data.date);
                    
                    if (now.toDateString() === storedDate.toDateString()) {
                        state.winnersCount = data.winnersCount || 0;
                        state.lastWinner = data.lastWinner || null;
                    } else {
                        await resetDaily();
                    }
                } else {
                    await resetDaily();
                }
                
                updateStockDisplay();
                displayLastWinner();
                
                onValue(gameStateRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        const now = new Date();
                        const storedDate = new Date(data.date);
                        
                        if (now.toDateString() === storedDate.toDateString()) {
                            state.winnersCount = data.winnersCount || 0;
                            state.lastWinner = data.lastWinner || null;
                            updateStockDisplay();
                            displayLastWinner();
                        }
                    }
                });
                
            } catch (error) {
                console.error('Erreur Firebase:', error);
                document.getElementById('stockCounter').innerHTML = '⚠️ Erreur';
            }
        }

        async function resetDaily() {
            const now = new Date();
            await set(gameStateRef, {
                date: now.toISOString(),
                winnersCount: 0,
                lastWinner: null
            });
            state.winnersCount = 0;
            state.lastWinner = null;
        }

        async function saveState() {
            const now = new Date();
            try {
                await set(gameStateRef, {
                    date: now.toISOString(),
                    winnersCount: state.winnersCount,
                    lastWinner: state.lastWinner
                });
            } catch (error) {
                console.error('Erreur de sauvegarde:', error);
            }
        }

        function updateStockDisplay() {
            const remaining = state.totalPrizes - state.winnersCount;
            const stockCounter = document.getElementById('stockCounter');
            
            if (remaining === 0) {
                stockCounter.className = 'stock-counter stock-empty';
                stockCounter.innerHTML = '<strong>0</strong>';
            } else {
                stockCounter.className = 'stock-counter';
                stockCounter.innerHTML = `<strong>${remaining}</strong>`;
            }
        }

        function displayLastWinner() {
            const winnerDiv = document.getElementById('lastWinner');
            if (state.lastWinner) {
                const winTime = new Date(state.lastWinner.time);
                const timeStr = winTime.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                winnerDiv.innerHTML = `🏆 <strong>Dernier gagnant</strong> à ${timeStr}`;
                winnerDiv.style.display = 'block';
            } else {
                winnerDiv.style.display = 'none';
            }
        }

        function createConfetti() {
            const colors = ['#ff006e', '#00d2ff', '#ffd700', '#00f260', '#ff6b6b', '#4ecdc4'];
            const shapes = ['○', '●', '◆', '■', '★', '▲'];
            
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.fontSize = (Math.random() * 15 + 10) + 'px';
                    confetti.style.animationDelay = Math.random() * 0.3 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 20);
            }
        }

        function isWithinTimeRange() {
            const now = new Date();
            const hour = now.getHours();
            return hour >= 7 && hour < 20;
        }

        function shouldWin() {
            if (state.winnersCount >= state.totalPrizes) {
                return false;
            }
            return Math.random() < 0.30;
        }

        async function spin() {
            if (state.isSpinning) return;
            
            if (!isWithinTimeRange()) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result lose show';
                resultDiv.innerHTML = '⏰ <strong>Horaires :</strong><br>7h à 20h uniquement !';
                return;
            }

            if (state.winnersCount >= state.totalPrizes) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result lose show';
                resultDiv.innerHTML = '😔 <strong>Stock épuisé !</strong><br>Revenez demain !';
                return;
            }

            state.isSpinning = true;
            document.getElementById('spinButton').disabled = true;
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result';
            resultDiv.textContent = '';

            const wheel = document.getElementById('wheel');
            const isWinner = shouldWin();
            
            const spins = 6;
            const baseRotation = 360 * spins;
            let finalRotation;
            
            if (isWinner) {
                const winAngles = [45, 225];
                const randomWinAngle = winAngles[Math.floor(Math.random() * winAngles.length)];
                finalRotation = baseRotation + randomWinAngle;
            } else {
                const loseAngles = [135, 315];
                const randomLoseAngle = loseAngles[Math.floor(Math.random() * loseAngles.length)];
                finalRotation = baseRotation + randomLoseAngle;
            }

            wheel.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(async () => {
                state.isSpinning = false;
                document.getElementById('spinButton').disabled = false;
                
                if (isWinner) {
                    state.winnersCount++;
                    state.lastWinner = {
                        time: new Date().toISOString()
                    };
                    await saveState();
                    
                    createConfetti();
                    resultDiv.className = 'result win celebrate show';
                    resultDiv.innerHTML = '🎉 <strong>FÉLICITATIONS !</strong><br>Vous avez gagné un grille-pain ! 🎉';
                } else {
                    resultDiv.className = 'result lose show';
                    resultDiv.innerHTML = '😔 <strong>Dommage...</strong><br>Retentez votre chance !';
                }
            }, 4000);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            initializeState();
            document.getElementById('spinButton').addEventListener('click', spin);
        });
    </script>
</body>
</html>
