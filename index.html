<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roue de la Chance - Gagnez un Grille-Pain !</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f5f5dc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: clamp(20px, 5vw, 40px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 95%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: clamp(1.5em, 5vw, 2.5em);
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: clamp(0.9em, 3vw, 1.1em);
        }

        .wheel-container {
            position: relative;
            width: min(400px, 85vw);
            height: min(400px, 85vw);
            margin: 30px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 15px solid #333;
            position: relative;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(
                from 0deg,
                #4ecdc4 0deg 90deg,
                #ff6b6b 90deg 180deg,
                #4ecdc4 180deg 270deg,
                #ff6b6b 270deg 360deg
            );
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-text {
            position: absolute;
            width: 100%;
            height: 100%;
            font-size: clamp(1em, 3.5vw, 1.5em);
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .wheel-text span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }

        .wheel-text span:nth-child(1) {
            transform: translate(-50%, -50%) rotate(-45deg) translateY(calc(min(400px, 85vw) * -0.325)) rotate(45deg);
        }

        .wheel-text span:nth-child(2) {
            transform: translate(-50%, -50%) rotate(45deg) translateY(calc(min(400px, 85vw) * -0.325)) rotate(-45deg);
        }

        .wheel-text span:nth-child(3) {
            transform: translate(-50%, -50%) rotate(135deg) translateY(calc(min(400px, 85vw) * -0.325)) rotate(-135deg);
        }

        .wheel-text span:nth-child(4) {
            transform: translate(-50%, -50%) rotate(225deg) translateY(calc(min(400px, 85vw) * -0.325)) rotate(-225deg);
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(60px, 15vw);
            height: min(60px, 15vw);
            background: #333;
            border-radius: 50%;
            border: 5px solid white;
            z-index: 10;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: clamp(15px, 4vw, 20px) solid transparent;
            border-right: clamp(15px, 4vw, 20px) solid transparent;
            border-top: clamp(30px, 8vw, 40px) solid #ff6b6b;
            z-index: 5;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
        }

        .spin-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: clamp(15px, 3vw, 20px) clamp(30px, 8vw, 50px);
            font-size: clamp(1.1em, 3.5vw, 1.5em);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-top: 20px;
            width: auto;
            max-width: 90%;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .spin-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: clamp(15px, 3vw, 20px);
            border-radius: 10px;
            font-size: clamp(1em, 3vw, 1.3em);
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result.win {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .result.lose {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 10px;
            color: #004085;
        }

        .prizes-left {
            margin-top: 15px;
            font-size: 1.1em;
            color: #333;
        }

        @keyframes celebration {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .celebrate {
            animation: celebration 0.5s ease-in-out 3;
        }

        .stock-counter {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            font-size: 1.2em;
            color: #856404;
        }

        .stock-counter strong {
            color: #d39e00;
            font-size: 1.4em;
        }

        .stock-empty {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .stock-empty strong {
            color: #721c24;
        }

        .last-winner {
            margin-top: 15px;
            padding: 15px;
            background: #d1ecf1;
            border: 2px solid #bee5eb;
            border-radius: 10px;
            font-size: 1.1em;
            color: #0c5460;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Roue de la Chance 🎰</h1>
        <p class="subtitle">Tentez de gagner un grille-pain !</p>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-text">
                    <span>GAGNÉ</span>
                    <span>PERDU</span>
                    <span>GAGNÉ</span>
                    <span>PERDU</span>
                </div>
                <div class="wheel-center"></div>
            </div>
        </div>

        <button class="spin-button" id="spinButton" onclick="spin()">
            TOURNER LA ROUE
        </button>

        <div class="result" id="result"></div>

        <div class="stock-counter" id="stockCounter">
            📦 Stock disponible : <strong id="stockNumber">10</strong> grille-pains
        </div>

        <div class="last-winner" id="lastWinner">
            🎉 Dernier gagnant à --:--
        </div>
    </div>

    <script>
        const state = {
            winnersCount: 0,
            isSpinning: false,
            totalPrizes: 10,
            lastWinner: null
        };

        async function initializeState() {
            try {
                // Charger l'état partagé depuis le stockage persistant
                const result = await window.storage.get('wheelGameState', true);
                
                if (result && result.value) {
                    const data = JSON.parse(result.value);
                    const now = new Date();
                    const storedDate = new Date(data.date);
                    
                    // Vérifier si c'est le même jour
                    if (now.toDateString() === storedDate.toDateString()) {
                        state.winnersCount = data.winnersCount || 0;
                        state.lastWinner = data.lastWinner || null;
                    } else {
                        // Nouveau jour, réinitialiser
                        state.winnersCount = 0;
                        state.lastWinner = null;
                        await saveState();
                    }
                } else {
                    // Première initialisation
                    await saveState();
                }
            } catch (error) {
                console.log('Première initialisation du jeu');
                state.winnersCount = 0;
                state.lastWinner = null;
                await saveState();
            }
            
            updateStockDisplay();
            displayLastWinner();
        }

        async function saveState() {
            const now = new Date();
            const data = {
                date: now.toISOString(),
                winnersCount: state.winnersCount,
                lastWinner: state.lastWinner
            };
            
            try {
                await window.storage.set('wheelGameState', JSON.stringify(data), true);
            } catch (error) {
                console.error('Erreur de sauvegarde:', error);
            }
        }

        async function refreshStock() {
            // Recharger le stock depuis le serveur pour avoir les données à jour
            try {
                const result = await window.storage.get('wheelGameState', true);
                if (result && result.value) {
                    const data = JSON.parse(result.value);
                    const now = new Date();
                    const storedDate = new Date(data.date);
                    
                    if (now.toDateString() === storedDate.toDateString()) {
                        state.winnersCount = data.winnersCount || 0;
                        state.lastWinner = data.lastWinner || null;
                    }
                }
            } catch (error) {
                console.log('Erreur lors du rafraîchissement');
            }
            
            updateStockDisplay();
            displayLastWinner();
        }

        function updateStockDisplay() {
            const remaining = state.totalPrizes - state.winnersCount;
            const stockNumber = document.getElementById('stockNumber');
            const stockCounter = document.getElementById('stockCounter');
            
            stockNumber.textContent = remaining;
            
            if (remaining === 0) {
                stockCounter.className = 'stock-counter stock-empty';
                stockCounter.innerHTML = '❌ <strong>Stock épuisé</strong> - Tous les grille-pains ont été gagnés aujourd\'hui !';
            } else if (remaining <= 3) {
                stockCounter.style.background = '#fff3cd';
                stockCounter.innerHTML = `⚠️ Plus que <strong>${remaining}</strong> grille-pain${remaining > 1 ? 's' : ''} disponible${remaining > 1 ? 's' : ''} !`;
            } else {
                stockCounter.innerHTML = `📦 Stock disponible : <strong>${remaining}</strong> grille-pains`;
            }
        }

        function displayLastWinner() {
            const winnerDiv = document.getElementById('lastWinner');
            if (state.lastWinner) {
                const winTime = new Date(state.lastWinner.time);
                const timeStr = winTime.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                winnerDiv.textContent = `🎉 Dernier gagnant à ${timeStr}`;
                winnerDiv.style.display = 'block';
            } else {
                winnerDiv.style.display = 'none';
            }
        }

        function isWithinTimeRange() {
            const now = new Date();
            const hour = now.getHours();
            return hour >= 7 && hour < 20;
        }

        function shouldWin() {
            // Vérifier s'il reste des cadeaux
            if (state.winnersCount >= state.totalPrizes) {
                return false;
            }
            
            // Probabilité de gain : 30% de chance
            return Math.random() < 0.30;
        }

        async function spin() {
            if (state.isSpinning) return;
            
            // Rafraîchir le stock avant de jouer
            await refreshStock();
            
            if (!isWithinTimeRange()) {
                document.getElementById('result').className = 'result lose';
                document.getElementById('result').textContent = '⏰ Le tirage est disponible uniquement entre 7h et 20h !';
                return;
            }

            if (state.winnersCount >= state.totalPrizes) {
                document.getElementById('result').className = 'result lose';
                document.getElementById('result').textContent = '😔 Désolé, tous les grille-pains ont déjà été gagnés aujourd\'hui !';
                return;
            }

            state.isSpinning = true;
            document.getElementById('spinButton').disabled = true;
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = 'result';

            const wheel = document.getElementById('wheel');
            const isWinner = shouldWin();
            
            const spins = 5;
            const baseRotation = 360 * spins;
            let finalRotation;
            
            if (isWinner) {
                const winAngles = [45, 225];
                const randomWinAngle = winAngles[Math.floor(Math.random() * winAngles.length)];
                finalRotation = baseRotation + randomWinAngle;
            } else {
                const loseAngles = [135, 315];
                const randomLoseAngle = loseAngles[Math.floor(Math.random() * loseAngles.length)];
                finalRotation = baseRotation + randomLoseAngle;
            }

            wheel.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(async () => {
                state.isSpinning = false;
                document.getElementById('spinButton').disabled = false;

                const resultDiv = document.getElementById('result');
                
                if (isWinner) {
                    state.winnersCount++;
                    state.lastWinner = {
                        time: new Date().toISOString()
                    };
                    await saveState();
                    updateStockDisplay();
                    displayLastWinner();
                    
                    resultDiv.className = 'result win celebrate';
                    resultDiv.textContent = '🎉 FÉLICITATIONS ! Vous avez gagné un grille-pain ! 🎉';
                } else {
                    resultDiv.className = 'result lose';
                    resultDiv.textContent = '😔 Dommage ! Réessayez votre chance !';
                }
            }, 4000);
        }

        // Rafraîchir le stock toutes les 10 secondes
        setInterval(refreshStock, 10000);

        window.onload = initializeState;
    </script>
</body>
</html>
